name: security
on:
  push:
  pull_request:
  schedule:
    - cron: "41 5 * * 1" # weekly: new detection rules and new advisories apply to old code too
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan every commit, not just the last
          persist-credentials: false
      - name: gitleaks 8.30.1, checksum-pinned
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --no-banner --redact -c .gitleaks.toml .
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: no unreviewed high or critical advisory (node, safe-trading-agent)
        run: |
          for d in node safe-trading-agent; do
            (cd $d && npm ci --no-fund --no-audit --ignore-scripts && npm audit --omit=dev --json > "$RUNNER_TEMP/$d.json" || true)
            node .github/audit-check.mjs "$RUNNER_TEMP/$d.json" $d/audit-exceptions.txt
          done
      - name: pip-audit (python)
        run: pip install -r python/requirements-dev.txt && pip-audit -r python/requirements.txt
